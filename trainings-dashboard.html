html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 24px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;line-height:1.2;margin:0;color:var(--ink)}
p{margin:0}
a{color:var(--teal-ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.spacer{flex:1}

/* logo top-right of each view (from reference) */
.view>.wrap::before{content:"";display:block;width:118px;height:34px;margin:0 0 14px auto;background:var(--logo) no-repeat right center/contain}
.view.nologo>.wrap::before{display:none}

/* hero (from reference) */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:28px;padding:40px 48px 44px;min-height:460px;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:20px;position:relative;z-index:1;padding-left:96px}
.hero-top .ul{display:block;width:160px;height:46px;background:var(--logo) no-repeat left center/contain}
.hero-top .team{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.hero-main{position:relative;z-index:1}
.hero-main .k{font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--hero-k)}
.hero h1{font-size:clamp(34px,5.4vw,64px);line-height:1.05;color:var(--hero-h);margin:12px 0 14px;max-width:780px}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero .sub{font-size:20px;font-weight:500;max-width:640px;color:var(--hero-muted)}
.hero-meta{display:flex;gap:44px;flex-wrap:wrap;position:relative;z-index:1}
.hero-meta .n{font-family:var(--head);font-weight:600;font-size:30px;color:var(--hero-h);line-height:1.1}
.hero-meta .r{font-size:15px;color:var(--hero-muted)}
.pix{position:absolute;pointer-events:none}
.pix rect{fill:var(--pix)}
.pix.tl{left:0;top:0}.pix.br{right:0;bottom:0}
@media (max-width:900px){.hero{padding:28px 24px 32px}.hero-meta{gap:24px}}
@media (max-width:640px){.hero-top{padding-left:0;flex-wrap:wrap}.hero-top .ul{width:120px;height:35px}.pix.tl{display:none}.hero h1{font-size:34px}.hero .sub{font-size:17px}}

/* shell + sidebar (from reference) */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:20px 14px 20px 18px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.back-link{display:inline-block;margin:-4px 0 8px;font-size:14px;font-weight:600;color:var(--teal-ink);text-decoration:none}
.back-link:hover{text-decoration:underline}
.brand{font-family:var(--head);font-weight:600;font-size:16px;line-height:1.25}
.brand span{display:block;color:var(--muted);font-weight:500;font-size:13px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;width:100%;text-align:left}
.nav{display:flex;flex-direction:column;gap:2px}
.grp{font-family:var(--head);font-size:13.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);padding:16px 12px 5px;margin:0}
.nav a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:15px;font-weight:500;padding:6px 12px;border-radius:10px;line-height:1.3}
.nav a:hover{color:var(--ink);background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--sel-bg);color:var(--sel-ink);font-weight:600;box-shadow:inset 3px 0 0 var(--teal)}
.subnav{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px 20px;padding-left:6px;border-left:2px solid var(--line)}
.subnav a{font-size:14.5px;padding:5px 10px}
.side-cta{margin-top:auto;padding:16px 12px 4px;font-size:13.5px;color:var(--muted)}
.side-cta a{font-weight:600}
.content{min-width:0}
@media (max-width:860px){.shell{display:block}.side{position:static;height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px}.menu-btn{display:block}.nav{display:none}.nav.open{display:flex}.side-cta{display:none}}

main{padding:28px 0 56px;min-height:70vh}
.view{display:none}
.view.on{display:block}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)}
.view>.wrap>h1,.view>.wrap>.head h1{font-size:clamp(28px,4.5vw,42px);margin:6px 0 10px}
.head{gap:12px;margin-bottom:10px}
.lead{font-size:19px;color:var(--muted);max-width:780px}
.section{margin-top:44px}
.section>h2{font-size:25px;margin-bottom:6px}
.section>.sub{color:var(--muted);margin-bottom:16px;max-width:780px}
.prose{max-width:780px}
.prose p+p{margin-top:12px}
.prose ul,.prose ol{margin:8px 0 0;padding-left:22px}
.prose li{margin:6px 0}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card.dark{background:var(--panel);color:var(--ink);border-color:var(--line)}
.card.dark .muted{color:var(--muted)}
.card h3{font-size:18px;margin-bottom:6px}
.muted{color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .num{font-family:var(--head);font-weight:600;font-size:40px;line-height:1;color:var(--teal)}
.stat .num em{font-style:normal;color:var(--orange)}
.stat .lab{font-weight:600}

/* catalog cards (from reference .pcard) */
.pcard{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.pcard:hover{transform:translateY(-2px);border-color:var(--teal)}
.pcard .pn{font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--teal-ink);text-transform:uppercase}
.pcard h3{font-size:20px;margin:0}
.pcard p{color:var(--muted);font-size:15px}

<script>
(function(){
  var root = document.documentElement, btn = document.getElementById('themeBtn');
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function render(){
    var dark = root.getAttribute('data-theme') === 'dark';
    btn.innerHTML = dark ? SUN : MOON;
    btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
    btn.setAttribute('aria-pressed', String(dark));
    btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('tps-theme', next); } catch (e) {}
    render();
  });
  render();
})();
</script>

        <div class="regcol"><p class="who">Partners</p><h3>${esc(o.register.title)}</h3><p class="t">${esc(o.register.text)}</p><a class="btn cta" href="${esc(o.register.url)}" target="_blank" rel="noopener">${esc(o.register.label)} ↗</a></div>
        ${customerCol()}
      </div>
      <h3 class="steps-h">Steps for partners</h3>
      <ol class="steps">${o.register.steps.map(s => `<li><span style="color:var(--ink)">${esc(s)}</span></li>`).join('')}</ol>
      ${o.type === 'ilt' ? '<p class="note" style="margin-top:14px">Full enrollment rules, including how seats are confirmed, are on <a href="#register">How to register</a>.</p>' : ''}
    </div>

    <div class="pager">${prev ? `<a href="#${prev.id}">← ${esc(prev.title)}</a>` : '<a href="#home">← Overview</a>'}${next ? `<a href="#${next.id}">${esc(next.title)} →</a>` : '<a href="#prereqs">Prerequisites at a glance →</a>'}</div>
  </div>`;
}

function renderPrereqs(){
  const cell = arr => arr.length ? `<ul>${arr.map(x => typeof x === 'string' ? `<li>${esc(x)}</li>` : `<li>${x.url ? ext(x.url, x.t) : x.href ? `<a href="${x.href}">${esc(x.t)}</a>` : esc(x.t)}</li>`).join('')}</ul>` : '<span class="muted">None</span>';
  const rows = O.map(o => {
    const p = o.prereq;
    const m = p.mandatory.length ? (p.oneOf ? `<span class="muted" style="font-size:13px">One of:</span>` : '') + cell(p.mandatory) : '<span class="muted">No course required</span>';
    return `<tr><td class="layer"><a href="#${o.id}">${esc(o.title)}</a><small>${esc(TYPES[o.type].label)} · ${esc(o.card[0])}</small></td><td>${m}</td><td>${cell(p.skills)}</td><td>${cell(p.setup)}</td></tr>`;
  }).join('');
  return `<div class="wrap">
    <p class="eyebrow">Plan your place</p><h1>Prerequisites at a glance</h1>
    <p class="lead">Everything each course and workshop expects before you attend, side by side.</p>
    <div class="section" style="margin-top:26px"><p class="decq">For instructor-led courses, the mandatory prerequisites must be completed <b>at least 2 weeks before</b> the session. Participants who haven’t completed them may not be confirmed.</p></div>
    <div class="section" style="margin-top:24px"><div class="table-wrap"><table>
      <thead><tr><th style="width:22%">Training</th><th style="width:26%">Mandatory before you attend</th><th>Experience</th><th>Setup &amp; availability</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
    <div class="section"><h2>Self-learning courses on UiPath Academy</h2><p class="sub">The prerequisite courses you can take at your own pace.</p>
      <div class="grid g2">
        ${[[LINKS.aaIntro,'UiPath Agentic Automation ILT – Introduction','~4 hrs · for Associate, or Professional (one option)'],[LINKS.ixp,'UiPath Intelligent Extraction Processing','For Document Understanding + IXP'],[LINKS.tmOverview,'UiPath Test Manager Overview','For Test Cloud'],[LINKS.desktopTest,'Desktop Test Automation using UiPath Studio','For Test Cloud']].map(c => `<a class="card pcard" href="${c[0]}" target="_blank" rel="noopener"><span class="pn">Self-learning</span><h3>${esc(c[1])}</h3><p>${esc(c[2])}</p><span class="gol">Open course ↗</span></a>`).join('')}
      </div></div>
    <div class="pager"><a href="#${O[O.length - 1].id}">← ${esc(O[O.length - 1].title)}</a><a href="#register">How to register →</a></div>
  </div>`;
}

function renderRegister(){
  return `<div class="wrap">
    <p class="eyebrow">Plan your place</p><h1>How to register</h1>
    <p class="lead">Instructor-led courses have limited seats per session. Here’s how enrollment works, from registering to getting your seat confirmed.</p>
    <div class="section" style="margin-top:26px">
      <div class="grid g2">
        <div class="regcol"><p class="who">Partners</p><h3>Enroll through the Partner Portal</h3><p class="t">The current enrollment for every course and session is on the UiPath Partner Portal. Sign in with your company email and submit a separate registration for each course you want to attend.</p><a class="btn cta" href="${LINKS.portal}" target="_blank" rel="noopener">Go to the Partner Portal ↗</a></div>
        ${customerCol()}
      </div>
    </div>
    <div class="section"><h2>Instructor-led courses: enrollment process for partners</h2><p class="sub">The orange steps are the ones most often missed, and they can lead to a registration being rejected.</p>
      <ol class="steps">${D.enrollment.map(s => `<li class="${s[2] ? 'key' : ''}"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></li>`).join('')}</ol>
    </div>
    <div class="section"><h2>Workshops and self-paced builds</h2><p class="sub">Coding Agents, Case Management &amp; Coding Agents, and Cartographer.</p>
      <div class="grid g3">${O.filter(o => o.type !== 'ilt').map(o => `<div class="card pcard t-${o.type}" style="cursor:default"><span class="pn">${esc(TYPES[o.type].label)}</span><h3>${esc(o.title)}</h3><p>${esc(o.register.text)}</p><p><b style="color:var(--orange-ink)">Customers:</b> connect with your UiPath account team.</p><div class="row" style="margin-top:auto"><a class="btn cta" href="${esc(o.register.url)}" target="_blank" rel="noopener">${esc(o.register.label)} ↗</a><a class="btn ghost" href="#${o.id}">Details</a></div></div>`).join('')}</div>
    </div>
    <div class="section"><div class="card dark"><h3>Need assistance?</h3><p class="muted" style="font-size:15px">For any questions or issues with the ILT Program or the workshops, <a href="${LINKS.desk}" target="_blank" rel="noopener">open a ticket with the Partner Success Service Desk ↗</a>.</p></div></div>
    <div class="pager"><a href="#prereqs">← Prerequisites at a glance</a><a href="#home">Back to overview →</a></div>
  </div>`;
}

/* ---------- build / route / events (pattern from the reference) ---------- */
const main = $('#main');
const panels = {};
function build(){
  VIEWS.forEach(v => {
    const s = document.createElement('section');
    s.className = 'view' + (v.id === 'home' ? ' nologo' : ''); s.id = 'view-' + v.id; s.setAttribute('aria-label', v.label);
    main.appendChild(s); panels[v.id] = s;
  });
  panels.home.innerHTML = renderHome();
  O.forEach((o, i) => { panels[o.id].innerHTML = renderOffering(o, i); });
  panels.prereqs.innerHTML = renderPrereqs();
  panels.register.innerHTML = renderRegister();
  const link = id => { const v = VIEWS.find(x => x.id === id); return `<a href="#${v.id}" data-v="${v.id}">${esc(v.label)}</a>`; };
  const groups = [
    ['Start', ['home']],
    ['Instructor-led courses', [O.filter(o => o.type === 'ilt').map(o => o.id)]],
    ['Workshops', [O.filter(o => o.type !== 'ilt').map(o => o.id)]],
    ['Plan your place', ['prereqs', 'register']]
  ];
  $('#nav').innerHTML = groups.map(g => `<p class="grp">${g[0]}</p>` + g[1].map(x => Array.isArray(x) ? `<div class="subnav">${x.map(link).join('')}</div>` : link(x)).join('')).join('');
}
function route(){
  let id = (location.hash || '').replace('#', '');
  if (!panels[id]) id = 'home';
  VIEWS.forEach(v => { panels[v.id].classList.toggle('on', v.id === id); });
  $$('#nav a').forEach(a => { if (a.dataset.v === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0, 0);
  const v = VIEWS.find(x => x.id === id);
  document.title = (id === 'home' ? '' : v.label + ' · ') + 'UiPath Trainings & Workshops';
}
function filterCatalog(){
  let shown = 0;
  $$('#catalog .pcard').forEach(c => {
    const ok = (catType === 'all' || c.dataset.type === catType) && (!catQuery || c.dataset.hay.includes(catQuery));
    c.style.display = ok ? '' : 'none'; if (ok) shown++;
  });
  $('#catEmpty').classList.toggle('on', shown === 0);
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-cat]');
  if (f){ catType = f.dataset.cat; $$('[data-cat]').forEach(b => b.setAttribute('aria-pressed', String(b === f))); filterCatalog(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'catSearch'){ catQuery = e.target.value.trim().toLowerCase(); filterCatalog(); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const id = (location.hash || '#home').slice(1); const i = Math.max(0, VIEWS.findIndex(v => v.id === id));
  const n = VIEWS[i + (e.key === 'ArrowRight' ? 1 : -1)]; if (n) location.hash = n.id;
});
$('#menuBtn').addEventListener('click', () => { const n = $('#nav'); const o = n.classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', String(o)); });
window.addEventListener('hashchange', () => { $('#nav').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); route(); });
build(); route();
</script>
</body>
</html>
